<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="200" viewBox="0 0 1600 200">
<style>
@font-face{font-family:'Orb';src:url(data:font/woff2;base64,) format('woff2');}
.t{font-family:'Orb',Verdana,sans-serif;font-weight:800;}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes flick{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.35}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.flick{animation:flick 6s infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
</style>
<defs>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
<feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-5%" y="-30%" width="110%" height="160%"><feGaussianBlur stdDeviation="1.6" result="b"/><feComponentTransfer in="b" result="b"><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="ll" x1="0" x2="1"><stop offset="0" stop-color="#ff79c6" stop-opacity="0"/><stop offset="1" stop-color="#ff79c6"/></linearGradient>
<linearGradient id="lr" x1="0" x2="1"><stop offset="0" stop-color="#ff79c6"/><stop offset="1" stop-color="#ff79c6" stop-opacity="0"/></linearGradient>
<linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffe3f3"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
</defs>
<g class="flick">
<text x="800" y="112" text-anchor="middle" class="t" font-size="104" letter-spacing="8" fill="none" stroke="#c792ea" stroke-width="4" filter="url(#glow)">USEVALAD BUBEN</text>
<text x="800" y="112" text-anchor="middle" class="t" font-size="104" letter-spacing="8" fill="none" stroke="#ffffff" stroke-width="1.4">USEVALAD BUBEN</text>
</g>
<rect x="180" y="156.4" width="236.7" height="3" fill="url(#ll)" filter="url(#glow)"/>
<rect x="1183.3" y="156.4" width="236.7" height="3" fill="url(#lr)" filter="url(#glow)"/>
<rect x="326.7" y="156.4" width="90" height="3" fill="url(#pg)" filter="url(#glow)"><animate attributeName="x" values="326.7;180.0" dur="2.6s" repeatCount="indefinite" calcMode="spline" keySplines=".3 0 .7 1"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.35;1" dur="2.6s" repeatCount="indefinite"/></rect><rect x="1183.3" y="156.4" width="90" height="3" fill="url(#pg)" filter="url(#glow)"><animate attributeName="x" values="1183.3;1330.0" dur="2.6s" repeatCount="indefinite" calcMode="spline" keySplines=".3 0 .7 1"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.35;1" dur="2.6s" repeatCount="indefinite"/></rect>
<rect x="428.7" y="151.9" width="12" height="12" transform="rotate(45 434.7 157.9)" fill="#7fdbca" filter="url(#glow)"/>
<rect x="1159.3" y="151.9" width="12" height="12" transform="rotate(45 1165.3 157.9)" fill="#7fdbca" filter="url(#glow)"/>
<rect x="594.4" y="153.4" width="9" height="9" transform="rotate(45 598.9 157.9)" fill="#7fdbca" filter="url(#glow)"/><rect x="930.7" y="153.4" width="9" height="9" transform="rotate(45 935.2 157.9)" fill="#7fdbca" filter="url(#glow)"/>
<text x="466.7" y="168" class="t" font-size="28" letter-spacing="10" fill="#7fdbca" filter="url(#soft)">IDEA</text><text x="626.9" y="168" class="t" font-size="28" letter-spacing="10" fill="#7fdbca" filter="url(#soft)">PROTOTYPE</text><text x="963.2" y="168" class="t" font-size="28" letter-spacing="10" fill="#7fdbca" filter="url(#soft)">POLISH</text>
</svg>