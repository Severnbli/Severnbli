<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="230" viewBox="0 0 1600 230" text-rendering="geometricPrecision">
<style>
@font-face{font-family:'Orb';src:url(data:font/woff2;base64,) format('woff2');}
.t{font-family:'Orb',Verdana,sans-serif;font-weight:800;}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes flick{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.35}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.flick{animation:flick 6s infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
</style>
<style>
.s0{stop-color:#c792ea}.s1{stop-color:#ff79c6}.s2{stop-color:#7fdbca}.sub{fill:#7fdbca}
@media (prefers-color-scheme: light){.s0{stop-color:#7c3aed}.s1{stop-color:#db2777}.s2{stop-color:#0f766e}.sub{fill:#0f766e}}
</style>
<defs><linearGradient id="name" x1="0" x2="1">
<stop offset="0" class="s0"/><stop offset=".5" class="s1"/><stop offset="1" class="s2"/></linearGradient></defs>
<text x="800.0" y="128" text-anchor="middle" class="t" font-size="112" letter-spacing="6" fill="url(#name)">USEVALAD BUBEN</text>
<text x="800.0" y="192" text-anchor="middle" class="t sub" font-size="30" letter-spacing="14">IDEA · PROTOTYPE · POLISH</text>
</svg>