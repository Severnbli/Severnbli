<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="66" viewBox="0 0 1600 66">
<style>
@font-face{font-family:'Orb';src:url(data:font/woff2;base64,) format('woff2');}
.t{font-family:'Orb',Verdana,sans-serif;font-weight:800;}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes flick{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.35}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.flick{animation:flick 6s infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
</style>
<defs>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
<feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="ll" x1="0" x2="1"><stop offset="0" stop-color="#ff79c6" stop-opacity="0"/><stop offset="1" stop-color="#ff79c6"/></linearGradient>
<linearGradient id="lr" x1="0" x2="1"><stop offset="0" stop-color="#ff79c6"/><stop offset="1" stop-color="#ff79c6" stop-opacity="0"/></linearGradient>
<linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffe3f3"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
</defs>
<rect x="180" y="31.5" width="380" height="3" fill="url(#ll)" filter="url(#glow)"/>
<rect x="1040" y="31.5" width="380" height="3" fill="url(#lr)" filter="url(#glow)"/>
<rect x="470.0" y="31.5" width="90" height="3" fill="url(#pg)" filter="url(#glow)"><animate attributeName="x" values="470.0;180.0" dur="2.6s" repeatCount="indefinite" calcMode="spline" keySplines=".3 0 .7 1"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.35;1" dur="2.6s" repeatCount="indefinite"/></rect><rect x="1040.0" y="31.5" width="90" height="3" fill="url(#pg)" filter="url(#glow)"><animate attributeName="x" values="1040.0;1330.0" dur="2.6s" repeatCount="indefinite" calcMode="spline" keySplines=".3 0 .7 1"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.35;1" dur="2.6s" repeatCount="indefinite"/></rect>
<rect x="582" y="27" width="12" height="12" transform="rotate(45 588 33)" fill="#7fdbca" filter="url(#glow)"/>
<rect x="1006" y="27" width="12" height="12" transform="rotate(45 1012 33)" fill="#7fdbca" filter="url(#glow)"/>
<g class="flick">
<text x="800" y="47" text-anchor="middle" class="t" font-size="38" letter-spacing="12" fill="none" stroke="#c792ea" stroke-width="2.4" filter="url(#glow)">STATS</text>
<text x="800" y="47" text-anchor="middle" class="t" font-size="38" letter-spacing="12" fill="none" stroke="#ffffff" stroke-width=".9">STATS</text>
</g>
</svg>