<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="160" viewBox="0 0 1600 160">
<style>
@font-face{font-family:'Orb';src:url(data:font/woff2;base64,) format('woff2');}
.t{font-family:'Orb',Verdana,sans-serif;font-weight:800;}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes flick{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.35}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.flick{animation:flick 6s infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
</style>
<defs>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
<feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-5%" y="-30%" width="110%" height="160%"><feGaussianBlur stdDeviation="1.6" result="b"/><feComponentTransfer in="b" result="b"><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="ll" x1="0" x2="1"><stop offset="0" stop-color="#ff79c6" stop-opacity="0"/><stop offset="1" stop-color="#ff79c6"/></linearGradient>
<linearGradient id="lr" x1="0" x2="1"><stop offset="0" stop-color="#ff79c6"/><stop offset="1" stop-color="#ff79c6" stop-opacity="0"/></linearGradient>
<linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffe3f3"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
</defs>
<g class="flick">
<text x="800" y="132" text-anchor="middle" class="t" font-size="52" letter-spacing="8" fill="none" stroke="#c792ea" stroke-width="2.6" filter="url(#glow)">USEVALAD BUBEN</text>
<text x="800" y="132" text-anchor="middle" class="t" font-size="52" letter-spacing="8" fill="none" stroke="#ffffff" stroke-width="1">USEVALAD BUBEN</text>
</g>
<rect x="180" y="111.8" width="229.0" height="3" fill="url(#ll)" filter="url(#glow)"/>
<rect x="1191.0" y="111.8" width="229.0" height="3" fill="url(#lr)" filter="url(#glow)"/>
<rect x="319.0" y="111.8" width="90" height="3" fill="url(#pg)" filter="url(#glow)"><animate attributeName="x" values="319.0;180.0;319.0" keyTimes="0;.5;1" dur="4.4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></rect><rect x="1191.0" y="111.8" width="90" height="3" fill="url(#pg)" filter="url(#glow)"><animate attributeName="x" values="1191.0;1330.0;1191.0" keyTimes="0;.5;1" dur="4.4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></rect>
<rect x="421.0" y="107.3" width="12" height="12" transform="rotate(45 427.0 113.3)" fill="#7fdbca" filter="url(#glow)"/>
<rect x="1167.0" y="107.3" width="12" height="12" transform="rotate(45 1173.0 113.3)" fill="#7fdbca" filter="url(#glow)"/>
<rect width="1600" height="160" fill="#0d1117" fill-opacity="0.002"><animate attributeName="fill-opacity" values="0.002;0.003" dur="0.1s" calcMode="discrete" repeatCount="indefinite"/></rect>
<rect x="351.9" y="41.6" width="13.1" height="13.1" transform="rotate(45 358.5 48.1)" fill="#7fdbca" filter="url(#glow)" opacity="0" visibility="hidden"><animate attributeName="opacity" values="0;1;.3;1;0" keyTimes="0;0.0980;0.1137;0.1294;0.8627" dur="5.10s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="visibility" values="hidden;visible;visible;visible;hidden" keyTimes="0;0.0980;0.1137;0.1294;0.8627" dur="5.10s" calcMode="discrete" repeatCount="indefinite"/></rect><rect x="815.2" y="41.6" width="13.1" height="13.1" transform="rotate(45 821.8 48.1)" fill="#7fdbca" filter="url(#glow)" opacity="0" visibility="hidden"><animate attributeName="opacity" values="0;1;.3;1;0" keyTimes="0;0.1961;0.2118;0.2275;0.8627" dur="5.10s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="visibility" values="hidden;visible;visible;visible;hidden" keyTimes="0;0.1961;0.2118;0.2275;0.8627" dur="5.10s" calcMode="discrete" repeatCount="indefinite"/></rect><rect x="1126.7" y="41.6" width="13.1" height="13.1" transform="rotate(45 1133.2 48.1)" fill="#7fdbca" filter="url(#glow)" opacity="0" visibility="hidden"><animate attributeName="opacity" values="0;1;.3;1;0" keyTimes="0;0.2941;0.3098;0.3255;0.8627" dur="5.10s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="visibility" values="hidden;visible;visible;visible;hidden" keyTimes="0;0.2941;0.3098;0.3255;0.8627" dur="5.10s" calcMode="discrete" repeatCount="indefinite"/></rect>
